name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          for f in task_service/requirements.txt notification_service/requirements.txt requirements-dev.txt; do
            if [ -f "$f" ]; then pip install -r "$f"; fi
          done

      - name: Тесты Task Service
        if: hashFiles('task_service/tests/**') != ''
        run: python -m pytest task_service -q

      - name: Тесты Notification Service
        if: hashFiles('notification_service/tests/**') != ''
        run: python -m pytest notification_service -q

      - name: Интеграционные тесты
        if: hashFiles('tests/integration/**') != ''
        run: python -m pytest tests/integration -q
